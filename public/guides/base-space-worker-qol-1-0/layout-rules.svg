<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Base border and stack space rules">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="238" rx="13" fill="none" stroke="rgba(59,130,255,0.18)" stroke-width="1"/>

  <text x="28" y="36" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">FLOOR SPACE RULES</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="28" y="56" width="236" height="148" rx="10" fill="url(#card)" stroke="rgba(255,176,32,0.4)" stroke-width="1.5"/>
    <rect x="28" y="56" width="236" height="4" rx="2" fill="#FFB020"/>
    <text x="48" y="92" fill="#FFB020" font-size="11" font-weight="700" letter-spacing="0.12em">01</text>
    <text x="48" y="118" fill="#F4F5F8" font-size="17" font-weight="700">50% border rule</text>
    <text x="48" y="146" fill="#C5CAD6" font-size="13" font-weight="400">Big stations count if half</text>
    <text x="48" y="166" fill="#C5CAD6" font-size="13" font-weight="400">sits inside the blue ring</text>
    <text x="48" y="190" fill="#8A93A8" font-size="12" font-weight="400">Ranch / Breeding / Expedition</text>

    <rect x="282" y="56" width="236" height="148" rx="10" fill="url(#card)" stroke="rgba(59,130,255,0.4)" stroke-width="1.5"/>
    <rect x="282" y="56" width="236" height="4" rx="2" fill="#3B82FF"/>
    <text x="302" y="92" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">02</text>
    <text x="302" y="118" fill="#F4F5F8" font-size="17" font-weight="700">Stack vertical</text>
    <text x="302" y="146" fill="#C5CAD6" font-size="13" font-weight="400">Center support is enough</text>
    <text x="302" y="166" fill="#C5CAD6" font-size="13" font-weight="400">Scaffold / build / delete props</text>
    <text x="302" y="190" fill="#8A93A8" font-size="12" font-weight="400">Farms / chests / craft lines</text>

    <rect x="536" y="56" width="236" height="148" rx="10" fill="url(#card)" stroke="rgba(110,160,255,0.35)" stroke-width="1.5"/>
    <rect x="536" y="56" width="236" height="4" rx="2" fill="#6EA0FF"/>
    <text x="556" y="92" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">03</text>
    <text x="556" y="118" fill="#F4F5F8" font-size="17" font-weight="700">Keep workers moving</text>
    <text x="556" y="146" fill="#C5CAD6" font-size="13" font-weight="400">Feed close, SAN farther</text>
    <text x="556" y="166" fill="#C5CAD6" font-size="13" font-weight="400">Hard-to-reach chests teleport</text>
    <text x="556" y="190" fill="#8A93A8" font-size="12" font-weight="400">Merchants live in Viewing Cage</text>
  </g>
</svg>
