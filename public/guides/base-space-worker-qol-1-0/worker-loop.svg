<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Worker pathing priorities in a base">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="238" rx="13" fill="none" stroke="rgba(59,130,255,0.18)" stroke-width="1"/>

  <text x="28" y="36" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">WORKER PATHING</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- cards: x = 28, 218, 408, 598 | w=160 | gap arrows in 30px -->
    <rect x="28" y="56" width="160" height="132" rx="10" fill="url(#card)" stroke="rgba(59,130,255,0.35)" stroke-width="1.5"/>
    <rect x="28" y="56" width="160" height="4" rx="2" fill="#3B82FF"/>
    <text x="108" y="90" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">01</text>
    <text x="108" y="120" fill="#F4F5F8" font-size="16" font-weight="700">Job site</text>
    <text x="108" y="146" fill="#8A93A8" font-size="12" font-weight="400">Mine / craft / farm</text>

    <path d="M198 122h10" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="208,116 218,122 208,128" fill="#FFB020"/>

    <rect x="218" y="56" width="160" height="132" rx="10" fill="url(#card)" stroke="rgba(255,176,32,0.4)" stroke-width="1.5"/>
    <rect x="218" y="56" width="160" height="4" rx="2" fill="#FFB020"/>
    <text x="298" y="90" fill="#FFB020" font-size="11" font-weight="700" letter-spacing="0.12em">02</text>
    <text x="298" y="120" fill="#F4F5F8" font-size="16" font-weight="700">Feed Box</text>
    <text x="298" y="146" fill="#8A93A8" font-size="12" font-weight="400">Keep close</text>

    <path d="M388 122h10" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="398,116 408,122 398,128" fill="#FFB020"/>

    <rect x="408" y="56" width="160" height="132" rx="10" fill="url(#card)" stroke="rgba(110,160,255,0.35)" stroke-width="1.5"/>
    <rect x="408" y="56" width="160" height="4" rx="2" fill="#6EA0FF"/>
    <text x="488" y="90" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">03</text>
    <text x="488" y="120" fill="#F4F5F8" font-size="16" font-weight="700">Overflow</text>
    <text x="488" y="146" fill="#8A93A8" font-size="12" font-weight="400">Hard to reach</text>

    <path d="M578 122h10" stroke="#8A93A8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="588,116 598,122 588,128" fill="#8A93A8"/>

    <rect x="598" y="56" width="174" height="132" rx="10" fill="url(#card)" stroke="rgba(138,147,168,0.35)" stroke-width="1.5"/>
    <rect x="598" y="56" width="174" height="4" rx="2" fill="#8A93A8"/>
    <text x="685" y="90" fill="#8A93A8" font-size="11" font-weight="700" letter-spacing="0.12em">04</text>
    <text x="685" y="120" fill="#F4F5F8" font-size="16" font-weight="700">Hot Spring</text>
    <text x="685" y="146" fill="#8A93A8" font-size="12" font-weight="400">~9+ tiles away</text>
  </g>

  <text x="28" y="220" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400">Solid path = stay nearby · dashed = keep distant</text>
</svg>
