<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Breeding calculator two modes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
  </defs>

  <rect width="800" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="218" rx="13" fill="none" stroke="rgba(59,130,255,0.18)" stroke-width="1"/>

  <text x="28" y="36" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">TWO JOBS, ONE CALCULATOR</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <rect x="28" y="56" width="360" height="132" rx="10" fill="url(#card)" stroke="rgba(255,176,32,0.4)" stroke-width="1.5"/>
    <rect x="28" y="56" width="360" height="4" rx="2" fill="#FFB020"/>
    <text x="52" y="96" fill="#FFB020" font-size="15" font-weight="700">Parents → Child</text>
    <text x="52" y="126" fill="#F4F5F8" font-size="14" font-weight="600">Pick A + B</text>
    <text x="52" y="150" fill="#8A93A8" font-size="13" font-weight="400">See what the egg hatches in 1.0</text>
    <text x="52" y="172" fill="#8A93A8" font-size="12" font-weight="400">Share with ?a= &amp; ?b=</text>

    <rect x="412" y="56" width="360" height="132" rx="10" fill="url(#card)" stroke="rgba(59,130,255,0.4)" stroke-width="1.5"/>
    <rect x="412" y="56" width="360" height="4" rx="2" fill="#3B82FF"/>
    <text x="436" y="96" fill="#6EA0FF" font-size="15" font-weight="700">Child → Parents</text>
    <text x="436" y="126" fill="#F4F5F8" font-size="14" font-weight="600">Name the target</text>
    <text x="436" y="150" fill="#8A93A8" font-size="13" font-weight="400">Browse every valid pair</text>
    <text x="436" y="172" fill="#8A93A8" font-size="12" font-weight="400">Share with ?child=</text>
  </g>
</svg>
