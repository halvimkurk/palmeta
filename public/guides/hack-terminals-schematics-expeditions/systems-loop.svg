<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Hack terminals to schematics to drafting table">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="238" rx="13" fill="none" stroke="rgba(59,130,255,0.18)" stroke-width="1"/>

  <text x="28" y="36" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">GEAR UPGRADE LOOP</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <rect x="28" y="58" width="200" height="140" rx="10" fill="url(#card)" stroke="rgba(59,130,255,0.4)" stroke-width="1.5"/>
    <rect x="28" y="58" width="200" height="4" rx="2" fill="#3B82FF"/>
    <text x="128" y="96" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">01</text>
    <text x="128" y="128" fill="#F4F5F8" font-size="17" font-weight="700">Hack Terminal</text>
    <text x="128" y="156" fill="#8A93A8" font-size="13" font-weight="400">Ancient Ruins / fixed</text>

    <path d="M238 128h40" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="278,122 290,128 278,134" fill="#FFB020"/>

    <rect x="300" y="58" width="200" height="140" rx="10" fill="url(#card)" stroke="rgba(255,176,32,0.4)" stroke-width="1.5"/>
    <rect x="300" y="58" width="200" height="4" rx="2" fill="#FFB020"/>
    <text x="400" y="96" fill="#FFB020" font-size="11" font-weight="700" letter-spacing="0.12em">02</text>
    <text x="400" y="128" fill="#F4F5F8" font-size="17" font-weight="700">Schematics</text>
    <text x="400" y="156" fill="#8A93A8" font-size="13" font-weight="400">Keep every rarity</text>

    <path d="M510 128h40" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="550,122 562,128 550,134" fill="#FFB020"/>

    <rect x="572" y="58" width="200" height="140" rx="10" fill="url(#card)" stroke="rgba(110,160,255,0.4)" stroke-width="1.5"/>
    <rect x="572" y="58" width="200" height="4" rx="2" fill="#6EA0FF"/>
    <text x="672" y="96" fill="#6EA0FF" font-size="11" font-weight="700" letter-spacing="0.12em">03</text>
    <text x="672" y="124" fill="#F4F5F8" font-size="17" font-weight="700">Drafting Table</text>
    <text x="672" y="150" fill="#8A93A8" font-size="13" font-weight="400">5 same -&gt; next rarity</text>
    <text x="672" y="172" fill="#8A93A8" font-size="12" font-weight="400">Uncommon -&gt; Legendary</text>
  </g>
</svg>
