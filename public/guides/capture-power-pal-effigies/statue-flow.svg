<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img" aria-label="Pal Effigy to Capture Power flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1222"/>
      <stop offset="100%" stop-color="#070B16"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171E32"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </linearGradient>
  </defs>

  <rect width="800" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="798" height="218" rx="13" fill="none" stroke="rgba(59,130,255,0.18)" stroke-width="1"/>

  <text x="28" y="36" fill="#8A93A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">EFFIGY LOOP</text>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="58" width="200" height="120" rx="10" fill="url(#card)" stroke="rgba(59,130,255,0.35)" stroke-width="1.5"/>
    <rect x="40" y="58" width="200" height="4" rx="2" fill="#3B82FF"/>
    <text x="140" y="100" fill="#F4F5F8" font-size="17" font-weight="700">Find effigies</text>
    <text x="140" y="128" fill="#8A93A8" font-size="13" font-weight="400">Explore / map</text>

    <path d="M250 118h40" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="290,112 302,118 290,124" fill="#FFB020"/>

    <rect x="310" y="58" width="200" height="120" rx="10" fill="url(#card)" stroke="rgba(255,176,32,0.4)" stroke-width="1.5"/>
    <rect x="310" y="58" width="200" height="4" rx="2" fill="#FFB020"/>
    <text x="410" y="100" fill="#F4F5F8" font-size="17" font-weight="700">Statue of Power</text>
    <text x="410" y="128" fill="#8A93A8" font-size="13" font-weight="400">Offer ranks</text>

    <path d="M520 118h40" stroke="#FFB020" stroke-width="2" stroke-linecap="round"/>
    <polygon points="560,112 572,118 560,124" fill="#FFB020"/>

    <rect x="580" y="58" width="180" height="120" rx="10" fill="url(#card)" stroke="rgba(110,160,255,0.4)" stroke-width="1.5"/>
    <rect x="580" y="58" width="180" height="4" rx="2" fill="#6EA0FF"/>
    <text x="670" y="100" fill="#6EA0FF" font-size="17" font-weight="700">Capture Power</text>
    <text x="670" y="128" fill="#8A93A8" font-size="13" font-weight="400">Permanent boost</text>
  </g>
</svg>
